services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topology-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - DEBUG=${DEBUG:-false}
      - TOPOLOGY_SYNC_INTERVAL=${TOPOLOGY_SYNC_INTERVAL:-60}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./topology.db}
      - TLS_VERIFY=${TLS_VERIFY:-true}
      # Accepts JSON arrays or comma-separated origins.
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    env_file:
      - .env
    volumes:
      - ./config:/app/config:ro
      - ./clouds.yaml.example:/app/clouds.yaml.example:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - topology-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: topology-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - topology-network

networks:
  topology-network:
    driver: bridge
